# 手动发布 Release 工作流
#
# 使用方式（无需打 tag、无需命令行）：
#   1. GitHub 仓库页面 → Actions 选项卡 → 左侧 "Release (Manual)" → 右侧 "Run workflow"
#   2. 选择目标分支（默认 master）→ 点击绿色 "Run workflow" 按钮
#   3. 等待构建完成（3 个 MC 版本并行，约 10-15 分钟）
#   4. 自动创建 Draft Release（含 3 个 jar + md5 校验文件）
#   5. 到 Releases 页面检查草稿 → 点击 "Edit" 补充说明 → "Publish release" 正式发布
#
# 版本号自动读取 gradle.properties 中的 mod_version（如 0.0.17），
# Release tag 自动命名为 v<版本号>（如 v0.0.17）。

name: Release (Manual)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '要发布的分支（默认 master）'
        required: false
        default: 'master'

permissions:
  contents: write

# 同时只允许一个发布流程运行，避免重复创建 release
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # MC 1.20 + 1.20.1
          - minecraft: "1.20.1"
            minecraft_version: "1.20.1"
            mappings_version: "1.20.1+build.10"
            minecraft_version_out: "1.20.1"
            malilib_version: "0.16.1"
            itemscroller_version: "0.20.0"
            fabric_api_version: "0.92.6+1.20.1"
            fabric_api_version_min: "0.83.0"
            mod_menu_version: "7.2.2"
            minecraft_version_range: ">=1.20 <1.20.2"
          # MC 1.20.2
          - minecraft: "1.20.2"
            minecraft_version: "1.20.2"
            mappings_version: "1.20.2+build.4"
            minecraft_version_out: "1.20.2"
            malilib_version: "0.17.0"
            itemscroller_version: "0.21.0"
            fabric_api_version: "0.91.6+1.20.2"
            fabric_api_version_min: "0.86.1"
            mod_menu_version: "8.0.1"
            minecraft_version_range: ">=1.20.2 <1.20.3"
          # MC 1.20.3 + 1.20.4
          - minecraft: "1.20.4"
            minecraft_version: "1.20.4"
            mappings_version: "1.20.4+build.3"
            minecraft_version_out: "1.20.4"
            malilib_version: "0.18.0"
            itemscroller_version: "0.22.0"
            fabric_api_version: "0.92.1+1.20.4"
            fabric_api_version_min: "0.91.1"
            mod_menu_version: "9.0.0"
            minecraft_version_range: ">=1.20.3 <1.20.5"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || 'master' }}
      # Loom 1.14.x 插件类路径要求 JVM 21+（本机默认 JDK 亦为 21）；mod 仍以 release 17 编译
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Execute Gradle build
        run: |
          ./gradlew --no-daemon build \
            -Pminecraft_version=${{ matrix.minecraft_version }} \
            -Pmappings_version=${{ matrix.mappings_version }} \
            -Pminecraft_version_out=${{ matrix.minecraft_version_out }} \
            -Pmalilib_version=${{ matrix.malilib_version }} \
            -Pitemscroller_version=${{ matrix.itemscroller_version }} \
            -Pfabric_api_version=${{ matrix.fabric_api_version }} \
            -Pfabric_api_version_min=${{ matrix.fabric_api_version_min }} \
            -Pmod_menu_version=${{ matrix.mod_menu_version }} \
            "-Pminecraft_version_range=${{ matrix.minecraft_version_range }}"
      - name: Stage artifacts
        run: |
          mkdir staging
          cp build/libs/*.jar staging
          md5sum -t build/libs/*.jar > md5sum-${{ matrix.minecraft }}.txt
      - uses: actions/upload-artifact@v7
        with:
          name: release-jars-${{ matrix.minecraft }}
          path: staging
      - uses: actions/upload-artifact@v7
        with:
          name: release-md5-${{ matrix.minecraft }}
          path: md5sum-${{ matrix.minecraft }}.txt

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || 'master' }}
      # 记录目标 commit SHA（发布到该 commit 而不创建 git tag，保持仓库无 tag 习惯）
      - name: Read commit sha
        id: commit
        run: echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # 版本号自动读取 gradle.properties（如 0.0.17 → tag v0.0.17）
      - name: Read mod version
        id: version
        run: |
          MOD_VERSION=$(grep '^mod_version' gradle.properties | cut -d= -f2 | tr -d ' ')
          echo "VERSION=$MOD_VERSION" >> "$GITHUB_OUTPUT"
      - name: Download all jars
        uses: actions/download-artifact@v8
        with:
          path: release
          pattern: release-*
          merge-multiple: true
      - name: Collect md5 checksums
        run: |
          # 对合并下载的所有 jar 计算 md5（格式: "MD5 (文件名) = 哈希"）
          (cd release && for f in *.jar; do md5sum -t "$f"; done > md5sum.txt)
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 若同名 release 已存在（重复发布同一版本）则先删除，再重新创建
          gh release delete "v${{ steps.version.outputs.VERSION }}" --yes --cleanup-tag 2>/dev/null || true
          # 通过 REST API 创建 draft release，并指向目标 commit（不额外操作 git tag，保持仓库无 tag 习惯）
          release_id=$(gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/releases \
            -f tag_name="v${{ steps.version.outputs.VERSION }}" \
            -f target_commitish="${{ steps.commit.outputs.SHA }}" \
            -f name="AutoTrade v${{ steps.version.outputs.VERSION }}" \
            -f body="自动构建产物（MC 1.20 - 1.20.4），由 GitHub Actions 生成。请在发布前检查并补充说明。" \
            -F draft=true \
            --jq '.id')
          echo "release_id=$release_id"
          # 上传 jar 与 md5 校验文件作为 release assets
          # 注意：asset 上传必须走 uploads.github.com 端点，gh api 默认 api.github.com 会 404，
          # 因此用 gh release upload（内部正确处理该端点）
          gh release upload "v${{ steps.version.outputs.VERSION }}" release/*.jar release/md5sum.txt --clobber
