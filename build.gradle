plugins {
	id 'fabric-loom' version '1.14-SNAPSHOT'
	id 'com.diffplug.spotless' version '6.19.0'
}

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

repositories {
	maven { url = 'https://masa.dy.fi/maven' }
	maven { url = 'https://maven.terraformersmc.com/releases/' }
	maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.mappings_version}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
	modImplementation "fi.dy.masa.malilib:malilib-fabric-${project.minecraft_version_out}:${project.malilib_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modCompileOnly "com.terraformersmc:modmenu:${project.mod_menu_version}"
	// ItemScroller 可选依赖：编译期引用 villager API（fi.dy.masa.itemscroller.villager），运行时类由用户
	// 安装的 ItemScroller 提供（mod 内用 isModLoaded 检测，不新增运行时依赖）。jar 由 libs/ 目录 vendor
	// （见 libs/README.md），缺失会导致编译失败
	modCompileOnly files("libs/itemscroller-fabric-${project.minecraft_version_out}-${project.itemscroller_version}.jar")
}

group = project.group + "." + project.mod_id
base {
	archivesName = project.mod_file_name + '-' + project.minecraft_version_out
}
version = project.mod_version

if (version.endsWith('-dev')) {
	version += "." + new Date().format('yyyyMMdd.HHmmss')
}

// 预先读取属性到局部变量，避免任务执行时访问 project（Gradle 9/10 弃用 Task.project）
def minecraftVersionRange = project.property("minecraft_version_range")
def malilibVersion = project.property("malilib_version")
def fabricApiVersionMin = project.property("fabric_api_version_min")

processResources {
	// 所有 expand 变量必须注册为任务输入，否则跨版本构建时被 Gradle 判定 UP-TO-DATE 而打包旧 fabric.mod.json
	inputs.property "mod_version", version
	inputs.property "minecraft_version_range", minecraftVersionRange
	inputs.property "malilib_version", malilibVersion
	inputs.property "fabric_api_version_min", fabricApiVersionMin

	filesMatching("fabric.mod.json") {
		expand([
				"mod_version"            : version,
				"minecraft_version_range": minecraftVersionRange,
				"malilib_version"        : malilibVersion,
				"fabric_api_version_min" : fabricApiVersionMin
		])
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 17
}

spotless {
	java {
		importOrder()
		removeUnusedImports()
		cleanthat()
		eclipse()
		formatAnnotations()
	}
}
